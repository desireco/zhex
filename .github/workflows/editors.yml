name: Editor syntax support

on:
  push:
    branches: [main]
    paths: ["editors/**", "examples/**", ".github/workflows/editors.yml"]
  pull_request:
    paths: ["editors/**", "examples/**", ".github/workflows/editors.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  highlighting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - name: Install Vim and Neovim
        run: sudo apt-get update && sudo apt-get install -y vim neovim
      - name: Check Vim and Neovim syntax
        run: |
          vim -Nu NONE -n -es -S editors/vim/test/highlight.vim
          nvim --headless -u NONE -n -S editors/vim/test/highlight.vim
      - name: Install extension test tools
        run: npm ci --prefix editors/vscode
      - name: Prepare local Zed extension
        run: python3 editors/zed/prepare.py
      - name: Check TextMate scopes and package VS Code extension
        run: |
          npm --prefix editors/vscode test
          npm --prefix editors/vscode run package
      - name: Check Tree-sitter grammar and Zed queries
        working-directory: editors/tree-sitter-zhex
        run: |
          npx --yes --package tree-sitter-cli@0.26.9 -- tree-sitter test --config-path test/config.json
          npx --yes --package tree-sitter-cli@0.26.9 -- tree-sitter parse --grammar-path . --config-path test/config.json --quiet ../../examples/*.zhex ../testdata/highlighting.zhex
          npx --yes --package tree-sitter-cli@0.26.9 -- tree-sitter query --grammar-path . --config-path test/config.json --quiet ../zed/languages/zhex/brackets.scm ../../examples/hello.zhex
          npx --yes --package tree-sitter-cli@0.26.9 -- tree-sitter query --grammar-path . --config-path test/config.json --quiet ../zed/languages/zhex/outline.scm ../../examples/hello.zhex
          cmp queries/highlights.scm ../zed/languages/zhex/highlights.scm
